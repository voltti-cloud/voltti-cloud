<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI Player</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        .header { background: #000; padding: 10px; border-bottom: 2px solid #E60000; display: flex; align-items: center; }
        .logo { height: 30px; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        .video-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; max-height: 100%; outline: none; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">X</a>
        <img src="V.png" class="logo">
    </div>
    <div class="video-container">
        <video id="v-player" controls autoplay playsinline>
            <source src="" type="video/mp4">
        </video>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const videoSrc = params.get('v');
        if (videoSrc) {
            const video = document.getElementById('v-player');
            video.querySelector('source').src = videoSrc;
            video.load();
        }
    </script>
</body>
</html>
