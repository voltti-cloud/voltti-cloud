<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI Player</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; overflow: hidden; }
        .header { 
            background: #000; 
            padding: 10px; 
            border-bottom: 2px solid #E60000; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        .logo { height: 25px; }
        .back-btn { 
            color: white; 
            text-decoration: none; 
            font-size: 20px; 
            font-weight: bold; 
            padding: 5px 15px;
            background: #1a1a1a;
            border-radius: 5px;
        }
        .video-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; max-height: 100%; outline: none; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">SAIR</a>
        <img src="V.png" class="logo" onerror="this.src='https://via.placeholder.com/100x30/E60000/FFFFFF?text=VOLTTI'">
    </div>
    <div class="video-container">
        <video id="v-player" controls autoplay playsinline>
            <source src="" type="video/mp4">
        </video>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const videoSrc = params.get('v');
        if (videoSrc) {
            const video = document.getElementById('v-player');
            video.querySelector('source').src = decodeURIComponent(videoSrc);
            video.load();
        }
    </script>
</body>
</html>
