<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="top-nav">
            <div class="logo" onclick="window.location.reload()">
                <h1>VOLTTI<span>CLOUD</span></h1>
            </div>
            <div class="login-area">
                <input type="email" id="user-email" placeholder="Seu e-mail VIP">
                <button onclick="salvarLogin()"><i class="fas fa-unlock"></i> Entrar</button>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Pesquisar..." onkeyup="buscar()">
            </div>
        </div>
        <nav class="cat-nav">
            <button onclick="filtrar('filme')">Filmes</button>
            <button onclick="filtrar('serie')">Séries</button>
            <button onclick="filtrar('novela')">Novelas</button>
        </nav>
    </header>
    <main>
        <section id="player-section">
            <div id="placeholder" class="player-placeholder"><i class="fas fa-play"></i><p>Toque para assistir</p></div>
            <h2 id="video-title">Seja bem-vindo ao Voltti Cloud</h2>
            <div id="episodes-menu" style="display:none;" class="episodes-menu">
                <div id="episodes-list" class="episodes-list"></div>
            </div>
            <iframe id="voltti-iframe" allowfullscreen style="display:none;"></iframe>
        </section>
        <section id="movie-grid" class="movie-grid"></section>
    </main>
    <script>
        function salvarLogin() {
            const email = document.getElementById('user-email').value;
            if(email) {
                localStorage.setItem('voltti_email', email);
                alert("Login salvo! Verificando acesso VIP...");
                location.reload();
            }
        }
        window.addEventListener('load', () => {
            const salvo = localStorage.getItem('voltti_email');
            if(salvo) document.getElementById('user-email').value = salvo;
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
