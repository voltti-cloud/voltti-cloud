<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-main">
            <div class="logo" onclick="window.location.reload()">
                <img src="V.png" alt="">
                <h1>VOLTTI <span>CLOUD</span></h1>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Buscar filmes, séries..." onkeyup="buscar()">
            </div>
        </div>
        <nav class="nav-bar">
            <button onclick="filtrar('filme')">Filmes</button>
            <button onclick="filtrar('serie')">Séries</button>
            <button onclick="filtrar('novela')">Novelas</button>
            <button onclick="filtrar('dorama')">Doramas</button>
            <button onclick="filtrar('anime')">Animes</button>
        </nav>
    </header>
    <main>
        <section id="player-container">
            <div id="placeholder" class="placeholder"><i class="fas fa-play-circle"></i><p>Selecione para assistir</p></div>
            <h2 id="video-title">Bem-vindo, Mateus</h2>
            <div id="episodes-menu" style="display:none;" class="episodes-menu">
                <div id="episodes-list" class="episodes-list"></div>
            </div>
            <iframe id="voltti-iframe" allowfullscreen style="display:none;"></iframe>
        </section>
        <section id="movie-grid"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
