<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-text">VOLTTI <span class="accent">CLOUD</span></span>
        </div>
        <nav class="categories-nav">
            <button class="nav-btn" onclick="filtrar('todos')">Início</button>
            <button class="nav-btn" onclick="filtrar('filme')">Filmes</button>
            <button class="nav-btn" onclick="filtrar('serie')">Séries</button>
            <button class="nav-btn" onclick="filtrar('dorama')">Doramas</button>
        </nav>
    </header>

    <main>
        <section class="player-section">
            <div class="video-container">
                <iframe id="voltti-iframe" src="about:blank" frameborder="0" allowfullscreen></iframe>
                <div id="placeholder" class="placeholder" onclick="alert('Selecione um filme abaixo!')">
                    <div class="play-icon">▶</div>
                    <p>Toque para assistir</p>
                </div>
            </div>
            <h2 id="video-title">Seja bem-vindo, Mateus</h2>
        </section>

        <section id="movie-grid" class="movie-grid"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
