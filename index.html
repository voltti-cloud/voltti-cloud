<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header><div class="logo">VOLT<span>TI</span></div></header>

    <div id="home-content">
        <div class="catalog">
            <h3>🎬 Filmes</h3>
            <div id="lista-filmes" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>📺 Séries</h3>
            <div id="lista-series" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>🎎 Doramas</h3>
            <div id="lista-doramas" class="scroll-row"></div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="#" class="tab-item active" onclick="showSection('home')"><i data-lucide="home"></i>Início</a>
        <a href="#" class="tab-item" onclick="showSection('movies')"><i data-lucide="play-circle"></i>Filmes</a>
        <a href="#" class="tab-item" onclick="showSection('series')"><i data-lucide="tv"></i>Séries</a>
        <a href="#" class="tab-item" onclick="showSection('search')"><i data-lucide="search"></i>Busca</a>
    </nav>

    <div id="video-overlay" class="video-overlay">
        <button onclick="closePlayer()" class="close-btn">✕</button>
        <h2 id="video-title" style="text-align:center; margin-bottom:15px; font-size:1.1rem;"></h2>
        <div id="player-container"></div>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
