<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">VOLT<span>TI</span></div>
    </header>

    <main id="app">
        <h2 id="section-title">Filmes</h2>
        <div id="grid-content" class="grid-container"></div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="changeTab('filmes', this)">
            <span class="icon">🎬</span>
            <span class="label">Filmes</span>
        </div>
        <div class="nav-item" onclick="changeTab('series', this)">
            <span class="icon">📺</span>
            <span class="label">Séries</span>
        </div>
        <div class="nav-item" onclick="changeTab('doramas', this)">
            <span class="icon">🎎</span>
            <span class="label">Doramas</span>
        </div>
    </nav>

    <div id="player-view" class="player-view">
        <div class="player-header">
            <button class="close-btn" onclick="closePlayer()">✕</button>
            <span id="player-title"></span>
        </div>
        <div id="video-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
