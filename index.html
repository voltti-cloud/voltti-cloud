<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo-container"><span class="logo-text">VOLTTI <span class="accent">CLOUD</span></span></div>
        <nav class="categories-nav">
            <button class="nav-btn" onclick="filtrar('filme')">Filmes</button>
            <button class="nav-btn" onclick="filtrar('serie')">Séries</button>
            <button class="nav-btn" onclick="filtrar('dorama')">Doramas</button>
        </nav>
    </header>
    <main>
        <section class="player-section">
            <div class="video-container">
                <video id="main-player" controls autoplay playsinline>
                    <source id="video-source" src="" type="video/mp4">
                </video>
                <div id="placeholder" class="placeholder">
                    <i class="fas fa-play-circle" style="font-size: 2.5rem;"></i>
                    <p style="margin-top:8px; font-size:0.8rem;">Toque para assistir</p>
                </div>
            </div>
            <h2 id="video-title">Selecione um título</h2>
        </section>
        <section id="movie-grid" class="movie-grid"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
