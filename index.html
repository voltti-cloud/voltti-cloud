<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTI | Premium Stream</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <nav class="side-menu">
            <div class="logo">V<span>O</span></div>
            <div class="menu-items">
                <div class="item active" onclick="showCategory('filmes')">🎬</div>
                <div class="item" onclick="showCategory('series')">📺</div>
                <div class="item" onclick="showCategory('doramas')">🎎</div>
            </div>
        </nav>

        <main class="content">
            <header>
                <h1 id="category-title">Filmes <span>Premium</span></h1>
            </header>

            <section id="player-section" class="player-section">
                <div class="player-header">
                    <h2 id="now-playing">Selecione um título</h2>
                    <button onclick="closePlayer()" class="btn-close">Fechar</button>
                </div>
                <div id="video-dest" class="video-dest"></div>
            </section>

            <div id="grid-content" class="movie-grid"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
