<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="top-nav">
            <div class="logo" onclick="window.location.reload()">
                <h1>VOLTTI<span>CLOUD</span></h1>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="O que vamos assistir?" onkeyup="buscar()">
            </div>
        </div>
        <nav class="cat-nav">
            <button onclick="filtrar('filme')">Filmes</button>
            <button onclick="filtrar('serie')">Séries</button>
            <button onclick="filtrar('novela')">Novelas</button>
            <button onclick="filtrar('dorama')">Doramas</button>
            <button onclick="filtrar('anime')">Animes</button>
        </nav>
    </header>

    <main>
        <section id="hero-section" class="vizer-hero">
            <div class="hero-content">
                <p class="hero-label">Oppenheimer JÁ DISPONÍVEL!</p>
                <h2 class="hero-title">OPPENHEIMER</h2>
                <div class="hero-meta">2023 | 3h | ★★★★★</div>
                <div class="hero-btns">
                    <button class="btn-play" onclick="darPlay('https://motor.voltti.cloud/stream/56?hash=611132', 'OPPENHEIMER')">
                        <i class="fas fa-play"></i> ASSISTIR
                    </button>
                    <button class="btn-later">
                        <i class="fas fa-bookmark"></i> VER DEPOIS
                    </button>
                </div>
            </div>
        </section>

        <h2 id="current-title" class="section-indicator">Recomendados para Mateus</h2>
        
        <div id="episodes-menu" style="display:none;" class="episodes-wrapper">
            <div id="episodes-list" class="episodes-grid"></div>
        </div>

        <iframe id="voltti-iframe" allowfullscreen style="display:none;"></iframe>

        <section id="movie-grid"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
