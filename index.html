<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltti Cloud | Premium Streaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="logo">VOLTTI <span>CLOUD</span></div>
        <div class="user-icon" style="color: #edbd0d; font-weight: bold; cursor: pointer;" onclick="filter('vip')">💎 VIP</div>
    </header>

    <nav id="side-menu">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <a href="#" onclick="filter('filmes')">🎬 Filmes</a>
        <a href="#" onclick="filter('series')">📺 Séries</a>
        <a href="#" onclick="filter('doramas')">🌸 Doramas</a>
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        <a href="https://t.me/seu_contato" target="_blank" style="color: #edbd0d;">💎 ASSINAR VIP</a>
    </nav>

    <section class="hero" id="hero-banner">
        <div class="hero-content">
            <h1 id="hero-title">A Culpa é das Estrelas</h1>
            <p id="hero-desc">Um romance emocionante que conquistou o mundo.</p>
            <div class="hero-btns">
                <button class="btn-play" onclick="playDefault()">▶ Assistir</button>
                <button class="btn-info" onclick="filter('filmes')">ℹ Mais Info</button>
            </div>
        </div>
    </section>

    <main>
        <h2 id="cat-title">filmes</h2>
        <div class="grid" id="movie-grid"></div>
    </main>

    <div id="video-overlay" class="overlay">
        <div class="overlay-content">
            <span class="close-overlay" onclick="closeVid()">×</span>
            <h3 id="playing-title"></h3>
            <div id="player-wrap"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
