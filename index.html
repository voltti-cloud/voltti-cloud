<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Estilo do Player Embutido */
        #video-section { display: none; background: #000; width: 100%; position: sticky; top: 0; z-index: 1000; box-shadow: 0 5px 20px rgba(0,229,255,0.3); }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        video { width: 100%; height: 100%; }
        .video-info { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: var(--surface); }
        .video-info h2 { font-size: 1rem; color: var(--accent); }
        .close-player { color: #fff; background: #333; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <section id="video-section">
        <div class="video-container" id="player-target"></div>
        <div class="video-info">
            <h2 id="current-title">Carregando...</h2>
            <button class="close-player" onclick="closePlayer()">FECHAR X</button>
        </div>
    </section>

    <header id="main-header"><div class="logo">VOLT<span>TI</span></div></header>

    <main id="home-page">
        <div class="catalog">
            <h3>🎬 Filmes</h3>
            <div id="lista-filmes" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>📺 Séries</h3>
            <div id="lista-series" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>🎎 Doramas</h3>
            <div id="lista-doramas" class="scroll-row"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="#" class="tab-item active"><i data-lucide="home"></i>Início</a>
        <a href="#" class="tab-item"><i data-lucide="search"></i>Busca</a>
        <a href="#" class="tab-item"><i data-lucide="download"></i>Downloads</a>
        <a href="#" class="tab-item"><i data-lucide="user"></i>Perfil</a>
    </nav>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
