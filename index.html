<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voltti Player Official</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="video-container" id="videoContainer">
        <video id="mainVideo" playsinline webkit-playsinline></video>
        
        <img src="logo.png" class="voltti-watermark" alt="Voltti">

        <div class="controls-overlay">
            <div class="progress-area" id="progressArea">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="buttons-row">
                <div class="left-side">
                    <button id="playPauseBtn" class="play-icon"></button>
                    <span id="timeDisplay" class="time-text">0:00 / 0:00</span>
                </div>
                <div class="right-side">
                    <div class="volume-container">
                        <button id="muteBtn" class="volume-icon">🔊</button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
                    </div>
                    <button id="fullScreenBtn" class="fs-btn">⛶</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
