<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="V.png" alt="" class="main-logo">
            <h1>VOLTTI <span>CLOUD</span></h1>
        </div>
        <div class="search-bar-container">
            <input type="text" id="search-input" placeholder="Pesquisar filmes, séries..." onkeyup="buscar()">
            <i class="fas fa-search"></i>
        </div>
        <div class="menu-container">
            <nav class="categories-menu">
                <button onclick="window.location.reload()">Início</button>
                <button onclick="filtrar('filme')">Filmes</button>
                <button onclick="filtrar('serie')">Séries</button>
                <button onclick="filtrar('novela')">Novelas</button>
                <button onclick="filtrar('dorama')">Doramas</button>
                <button onclick="filtrar('anime')">Animes</button>
            </nav>
        </div>
    </header>
    <main>
        <section id="player-section">
            <div id="placeholder" class="player-placeholder"><i class="fas fa-play"></i><p>Toque para assistir</p></div>
            <h2 id="video-title">Seja bem-vindo, Mateus</h2>
            <div id="episodes-menu" style="display:none;" class="episodes-menu">
                <div id="episodes-list" class="episodes-list"></div>
            </div>
            <iframe id="voltti-iframe" allowfullscreen style="display:none;"></iframe>
        </section>
        <section id="movie-grid" class="movie-grid"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
