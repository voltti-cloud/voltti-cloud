<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.reload()">VOLTTI<span>CLOUD</span></div>
        <div class="header-icons">
            <i class="fas fa-search" onclick="toggleSearch()"></i>
            <i class="fas fa-user-circle" onclick="userStatus()"></i>
        </div>
    </header>

    <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="Pesquisar filme..." onkeyup="search()">
    </div>

    <nav class="categories">
        <div class="nav-btn active" onclick="filter('todos', this)">Tudo</div>
        <div class="nav-btn" onclick="filter('acao', this)">Ação</div>
        <div class="nav-btn" onclick="filter('romance', this)">Romance</div>
        <div class="nav-btn" onclick="filter('ficcao', this)">Ficção</div>
        <div class="nav-btn" onclick="filter('terror', this)">Terror</div>
        <div class="nav-btn" onclick="filter('comedia', this)">Comédia</div>
    </nav>

    <main id="movie-grid" class="grid"></main>

    <footer>
        <p>© 2026 Voltti Cloud - Mateus & Sandy</p>
    </footer>

    <div id="player-overlay" class="overlay">
        <div class="player-container">
            <span class="close-player" onclick="closeVid()">&times;</span>
            <h3 id="playing-title"></h3>
            <div id="video-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
