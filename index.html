<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="player-overlay">
        <div class="player-header">
            <h2 id="v-title">Carregando...</h2>
            <button class="btn-close" onclick="closePlayer()">FECHAR X</button>
        </div>
        <div class="video-container">
            <video id="player" playsinline controls referrerpolicy="no-referrer"></video>
        </div>
    </div>

    <header><div class="logo">VOLT<span>TI</span></div></header>
    
    <main>
        <div class="catalog">
            <h3>🎬 Filmes Adicionados</h3>
            <div id="list-movies" class="scroll-row"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="#" class="tab-item active"><i data-lucide="home"></i>Início</a>
        <a href="#" class="tab-item"><i data-lucide="play-circle"></i>Filmes</a>
        <a href="#" class="tab-item"><i data-lucide="tv"></i>Séries</a>
    </nav>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
