<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VOLTTI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="logo">VOLTTI</div>
        <div class="user-icon">S</div>
    </nav>

    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab('filmes', this)">Filmes</button>
        <button class="tab-btn" onclick="changeTab('series', this)">Séries</button>
        <button class="tab-btn" onclick="changeTab('doramas', this)">Doramas</button>
    </div>

    <main id="app">
        <div id="grid-content" class="grid-container"></div>
    </main>

    <div id="player-view" class="player-view">
        <div class="player-top">
            <button class="back-btn" onclick="closePlayer()">← Voltar</button>
            <span id="player-title"></span>
        </div>
        <div id="video-wrapper"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
