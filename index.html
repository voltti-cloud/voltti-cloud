<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="top-nav">
            <div class="logo" onclick="window.location.reload()">
                <h1>VOLTTI<span>CLOUD</span></h1>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Pesquisar..." onkeyup="buscar()">
            </div>
        </div>
        <nav class="cat-nav">
            <button onclick="filtrar('filme')">Filmes</button>
            <button onclick="filtrar('serie')">Séries</button>
            <button onclick="filtrar('novela')">Novelas</button>
            <button onclick="filtrar('dorama')">Doramas</button>
            <button onclick="filtrar('anime')">Animes</button>
        </nav>
    </header>

    <main>
        <section id="hero-section" class="hero">
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-badge">Destaque da semana</span>
                    <h2 class="hero-title">OPPENHEIMER</h2>
                    <p class="hero-desc">O épico de Christopher Nolan sobre a criação da bomba atômica.</p>
                    <div class="hero-btns">
                        <button class="btn-play" onclick="darPlay('https://motor.voltti.cloud/stream/56?hash=611132', 'OPPENHEIMER')">
                            <i class="fas fa-play"></i> Assistir
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <h2 id="current-title" class="section-title">Recomendados</h2>
        
        <div id="episodes-menu" style="display:none;" class="ep-menu">
            <div id="episodes-list" class="ep-grid"></div>
        </div>

        <iframe id="voltti-iframe" allowfullscreen style="display:none;"></iframe>

        <section id="movie-grid"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
