<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Player Premium Custom */
        #vlt-player-box { 
            display: none; 
            width: 100%; 
            background: #000; 
            position: sticky; 
            top: 0; 
            z-index: 10000;
            border-bottom: 3px solid #00e5ff;
        }
        .vlt-video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .vlt-info { 
            padding: 15px; 
            background: #16161a; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .vlt-info h2 { font-size: 1rem; color: #fff; margin:0; }
        .vlt-close { 
            background: #ff4b2b; color: #fff; border: none; 
            padding: 8px 15px; border-radius: 20px; font-weight: bold; 
        }
    </style>
</head>
<body>
    <div id="vlt-player-box">
        <div class="vlt-video-wrap" id="vlt-anchor"></div>
        <div class="vlt-info">
            <h2 id="vlt-title">Carregando...</h2>
            <button class="vlt-close" onclick="closePlayer()">FECHAR X</button>
        </div>
    </div>

    <header id="vlt-header"><div class="logo">VOLT<span>TI</span></div></header>

    <main id="home-page">
        <div class="catalog">
            <h3>🎬 Filmes</h3>
            <div id="lista-filmes" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>📺 Séries</h3>
            <div id="lista-series" class="scroll-row"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="#" class="tab-item active"><i data-lucide="home"></i>Início</a>
        <a href="#" class="tab-item"><i data-lucide="tv"></i>Séries</a>
        <a href="#" class="tab-item"><i data-lucide="user"></i>Perfil</a>
    </nav>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
