<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --plyr-color-main: #00e5ff; }
        #player-wrapper { 
            display: none; 
            width: 100%; 
            background: #000; 
            position: sticky; 
            top: 0; 
            z-index: 9999;
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        
        .player-header {
            padding: 10px 15px;
            background: #16161a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .player-header h2 { font-size: 0.9rem; color: #fff; font-weight: 500; }
        .btn-close { background: none; border: none; color: #ff4b2b; cursor: pointer; }
    </style>
</head>
<body>
    <section id="player-wrapper">
        <div class="player-header">
            <h2 id="current-title">Carregando...</h2>
            <button class="btn-close" onclick="closePlayer()"><i data-lucide="x-circle"></i></button>
        </div>
        <div class="video-container">
            <video id="player" playsinline controls>
                <source src="" type="video/mp4" />
            </video>
        </div>
    </section>

    <header id="main-header"><div class="logo">VOLT<span>TI</span></div></header>

    <main id="home-page">
        <div class="catalog">
            <h3>🎬 Filmes</h3>
            <div id="lista-filmes" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>📺 Séries</h3>
            <div id="lista-series" class="scroll-row"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="#" class="tab-item active"><i data-lucide="home"></i>Início</a>
        <a href="#" class="tab-item"><i data-lucide="tv"></i>Séries</a>
        <a href="#" class="tab-item"><i data-lucide="user"></i>Perfil</a>
    </nav>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
