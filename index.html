<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-text">VOLTTI <span class="accent">CLOUD</span></span>
        </div>
        <nav class="categories-nav">
            <button class="nav-btn" onclick="filtrar('filme')"><i class="fas fa-film"></i> Filmes</button>
            <button class="nav-btn" onclick="filtrar('serie')"><i class="fas fa-tv"></i> Séries</button>
            <button class="nav-btn" onclick="filtrar('dorama')"><i class="fas fa-heart"></i> Doramas</button>
        </nav>
    </header>

    <main>
        <section class="player-section">
            <div class="video-container">
                <iframe id="main-player" src="" frameborder="0" allowfullscreen></iframe>
                <div id="placeholder" class="placeholder">
                    <i class="fas fa-play-circle"></i>
                    <p>Toque em um título para assistir</p>
                </div>
            </div>
            <h2 id="video-title">Bem-vindo, Mateus</h2>
        </section>

        <section id="movie-grid" class="movie-grid"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
