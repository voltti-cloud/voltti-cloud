<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="search-bar" class="search-overlay">
        <input type="text" placeholder="Buscar..." id="search-input">
        <span onclick="toggleSearch()" style="cursor:pointer">✕</span>
    </div>

    <header>
        <div class="logo">VOLT<span>TI</span></div>
        <div class="header-icons">
            <i data-lucide="search" onclick="toggleSearch()"></i>
            <i data-lucide="user" onclick="showPage('user-page')"></i>
        </div>
    </header>

    <main id="home-page" class="page active">
        <div class="featured-card">
            <div style="width:100%">
                <h2>The Last of Us</h2>
                <button class="btn-play" onclick="openPlayer('The Last of Us')">ASSISTIR</button>
            </div>
        </div>
        
        <div class="catalog">
            <h3>Populares</h3>
            <div class="scroll-row">
                <div class="movie-card" onclick="openPlayer('P1')" style="background-image:url('https://image.tmdb.org/t/p/w500/uDsv9LkwN6EH3SBFQDE3uHJyvY6.jpg')"></div>
                <div class="movie-card" onclick="openPlayer('P2')" style="background-image:url('https://image.tmdb.org/t/p/w500/8GxvA9zDZ9G0QZ8vjZnuD6P0pXb.jpg')"></div>
                <div class="movie-card" onclick="openPlayer('P3')" style="background-image:url('https://image.tmdb.org/t/p/w500/i8v6S8p0vXfI496N3FmUclI7m9o.jpg')"></div>
            </div>
        </div>
    </main>

    <main id="user-page" class="page">
        <div style="text-align:center; padding-top:40px;">
            <div style="width:70px; height:70px; background:var(--accent); border-radius:50%; margin:0 auto; color:black; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:2rem">V</div>
            <h2>Perfil Voltti</h2>
            <button class="btn-play" style="margin-top:20px; background:rgba(255,255,255,0.1); color:white">Sair</button>
        </div>
    </main>

    <div id="video-overlay" class="video-overlay">
        <button onclick="closePlayer()" style="position:absolute; top:20px; right:20px; background:none; color:white; border:none; font-size:1.5rem">✕</button>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column">
            <h2 id="video-title"></h2>
            <div style="width:90%; aspect-ratio:16/9; background:#111; border:1px dashed #444; display:flex; align-items:center; justify-content:center">
                Player Offline (Quarta-feira)
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="showPage('home-page')"><i data-lucide="home"></i>Início</div>
        <div class="tab-item" onclick="showPage('home-page')"><i data-lucide="star"></i>Destaques</div>
        <div class="tab-item" onclick="showPage('home-page')"><i data-lucide="tv"></i>Séries</div>
        <div class="tab-item" onclick="showPage('user-page')"><i data-lucide="user"></i>Conta</div>
    </nav>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
