<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* CSS direto para não ter erro */
        #video-section { 
            display: none; 
            width: 100%; 
            background: #000; 
            position: sticky; 
            top: 0; 
            z-index: 9999; 
        }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; display: block; }
        .video-info { 
            padding: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #16161a;
            border-bottom: 2px solid #00e5ff;
        }
        .video-info h2 { font-size: 0.9rem; color: #fff; margin: 0; }
        .close-player { 
            background: #ff4b2b; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <section id="video-section">
        <div class="video-container" id="player-target"></div>
        <div class="video-info">
            <h2 id="current-title">Carregando...</h2>
            <button class="close-player" onclick="closePlayer()">FECHAR X</button>
        </div>
    </section>

    <header id="main-header"><div class="logo">VOLT<span>TI</span></div></header>

    <main id="home-page">
        <div class="catalog">
            <h3>🎬 Filmes</h3>
            <div id="lista-filmes" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>📺 Séries</h3>
            <div id="lista-series" class="scroll-row"></div>
        </div>
        <div class="catalog">
            <h3>🎎 Doramas</h3>
            <div id="lista-doramas" class="scroll-row"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="#" class="tab-item active"><i data-lucide="home"></i>Início</a>
        <a href="#" class="tab-item"><i data-lucide="search"></i>Busca</a>
        <a href="#" class="tab-item"><i data-lucide="user"></i>Perfil</a>
    </nav>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
