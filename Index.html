<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI | Premium</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">VOLTTI</div>
        <div class="search-box">
            <input type="text" id="input-busca" placeholder="Buscar filme..." oninput="buscar()">
            <i class="fas fa-search"></i>
        </div>
        <div class="menu-toggle" id="mobile-menu" onclick="document.getElementById('nav-menu').classList.toggle('active')">
            <span></span><span></span><span></span>
        </div>
        <nav id="nav-menu">
            <ul>
                <li><a href="#" onclick="filtrar('todos')">Início</a></li>
                <li class="menu-destaque"><a href="pagar.html">ASSINAR</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="video-container" id="player-section">
            <div class="player-wrapper" id="container-iframe">
                <div id="placeholder-player" style="text-align:center; padding: 20% 0;">
                    <i class="fas fa-play-circle" style="font-size: 50px; color: #e50914;"></i>
                    <p style="margin-top:10px; color:#888;">Selecione um filme para dar o play</p>
                </div>
                <iframe id="main-player" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="display:none;"></iframe>
            </div>
            <h2 id="video-title">Seja bem-vindo, Mateus</h2>
        </section>
        
        <section id="movie-grid"></section>
    </main>

    <script src="script.js?v=player_fix_apk"></script>
</body>
</html>
