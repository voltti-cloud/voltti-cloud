<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTTI CLOUD | Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">VOLTTI</div>
        <div class="search-box">
            <input type="text" id="input-busca" placeholder="Buscar no catálogo..." oninput="buscar()">
            <i class="fas fa-search"></i>
        </div>
    </header>

    <main class="main-content">
        <section class="video-container">
            <div class="player-wrapper">
                <video id="player-voltti" controls autoplay playsinline poster="capa_padrao.webp">
                    <source id="video-source" src="" type="video/mp4">
                    Seu navegador não suporta o player.
                </video>
            </div>
            <h2 id="video-title">Escolha um filme para assistir</h2>
        </section>
        
        <section id="movie-grid"></section>
    </main>

    <script src="script.js?v=player_proprio_v2"></script>
</body>
</html>
